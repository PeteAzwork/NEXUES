version: "3.8"

services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NEXUS_PORT: "8080"
      NEXUS_MONGO_URI: "mongodb://mongo:27017"
      NEXUS_DATABASE_NAME: "nexus"
      NEXUS_COLLECTION_NAME: "snapshots"
      NEXUS_LOG_LEVEL: "info"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  nexus-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["./nexus-mcp"]
    ports:
      - "8081:8081"
    environment:
      NEXUS_MONGO_URI: "mongodb://mongo:27017"
      NEXUS_DATABASE_NAME: "nexus"
      NEXUS_COLLECTION_NAME: "snapshots"
      NEXUS_MCP_TRANSPORT: "sse"
      NEXUS_MCP_SSE_ADDR: ":8081"
      NEXUS_MCP_SERVER_NAME: "nexus-mcp"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
